# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: gotenberg-client
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gotenberg_client-${{ version }}.tar.gz
  sha256: 871b339ed98911279f94f3aaa6403ca7c59aaa695d8663249be6314ccd46719c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27,<2
    - pip
  run:
    - python >=${{ python_min }},<4
    - httpx >=0.27
    - typing_extensions

tests:
  - python:
      imports:
        - gotenberg_client
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: A Python client for interfacing with the Gotenberg API
  license: MPL-2.0
  license_file: LICENSE
  homepage: https://github.com/stumpylog/gotenberg-client/

extra:
  recipe-maintainers:
    - rxm7706
    - jsmolic
